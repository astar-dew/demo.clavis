    <style>
    /* ------------------------------------------------------------
       PC (1025 ~ 1440px) : story 2단 배치 가로 넘침 방지

       스킨은 story_text 45% + story_img 50% (합 95%) 인데
       1440px 이하에서 .inner 에 gap:5rem (65px) 이 고정값으로 붙습니다.
       0.95W + 65 <= W 를 만족하려면 W >= 1300px 이어야 하므로
       1025~1299px 구간에서는 가로 합계가 화면을 넘칩니다.
       짝수번째 story 는 flex-direction:row-reverse 라 넘친 만큼
       왼쪽이 잘려 문구가 브라우저 밖으로 가려집니다.

       gap 을 비율(5%)로 바꾸면 45 + 50 + 5 = 100% 로 어떤 폭에서도
       정확히 들어맞고, 좌우 15px 여백으로 화면 끝에 붙는 것도 막습니다.
    ------------------------------------------------------------ */
    @media all and (min-width:1025px) and (max-width:1440px) {

    .cnt-brand .review_item:hover img { transform:scale(1.03); }
    .cnt-brand .review_text { position:absolute; left:0; right:0; bottom:0; padding:1.8rem; text-align:center; color:#fff; background: linear-gradient(

    }

    /* ------------------------------------------------------------
       태블릿 ~ 모바일 (1024px 이하) : story 텍스트 영역 중앙 정렬

       레이아웃을 1024px 까지 끌어올린 뒤 중앙 정렬합니다.
       (PC 2단 배치 / 좌측 정렬은 그대로 유지)
    ------------------------------------------------------------ */
    @media all and (max-width:1024px) {
        .cnt-brand .story_list > .story .inner,
        .cnt-brand .story_list > .story:nth-of-type(even) .inner {
